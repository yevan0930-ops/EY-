<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Quest｜英文單字探險</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
:root{--ink:#24324b;--muted:#66738b;--blue:#4778ec;--purple:#7657d5;--green:#168b66;--paper:#fff;--bg:#f3f6ff;--line:#e8ecf6;--shadow:0 16px 40px #33466d12}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#e8f2ff 0,transparent 42%),radial-gradient(ellipse at 100% 70%,#f0eaff 0,transparent 35%),var(--bg);font-family:Nunito,'Noto Sans TC',sans-serif;color:var(--ink);min-height:100vh}
.wrap{max-width:1020px;margin:auto;padding:28px 22px 54px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{display:flex;gap:12px;align-items:center;font-size:20px;font-weight:900}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#5088f1,#8967e8);display:grid;place-items:center;color:white;font-size:23px;box-shadow:0 8px 18px #697edb55}.tag{font-size:13px;color:var(--muted);font-weight:700;background:#fff;padding:9px 14px;border-radius:30px;box-shadow:0 4px 14px #33466d0a}
.hero{margin-bottom:23px}.eyebrow{color:var(--blue);font-size:13px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase}.hero h1{font-size:clamp(30px,5vw,43px);margin:7px 0 5px;letter-spacing:-1px}.hero p{margin:0;color:var(--muted);font-size:16px}
.layout{display:grid;grid-template-columns:230px 1fr;gap:20px}.side,.panel{background:var(--paper);border:1px solid #fff;border-radius:23px;box-shadow:var(--shadow)}.side{padding:18px;height:max-content}.side h3{font-size:12px;color:var(--muted);letter-spacing:1px;margin:5px 10px 12px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:13px;color:#596780;font:800 15px Nunito,'Noto Sans TC',sans-serif;cursor:pointer}.nav button.active{background:#edf2ff;color:#3e6fe0}.nav .icon{display:inline-block;width:27px}.goal{margin-top:20px;padding:15px;background:#f8f9ff;border-radius:16px}.goalrow{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted)}.track{height:9px;border-radius:10px;background:#e8ecf7;margin:11px 0 7px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#598bf2,#9570e6);width:0%;border-radius:10px;transition:.3s}.tiny{font-size:11px;color:var(--muted)}
.main{min-height:530px}.panel{padding:27px;min-height:530px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:21px}.section-head h2{font-size:21px;margin:0}.count{background:#f0f3fc;color:#61708a;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:900}.flashcard{min-height:290px;border-radius:22px;background:linear-gradient(135deg,#edf5ff,#f4efff);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;position:relative;overflow:hidden}.flashcard:before,.flashcard:after{content:'';position:absolute;width:140px;height:140px;border-radius:50%;background:#fff8;top:-75px;left:-35px}.flashcard:after{width:100px;height:100px;top:auto;left:auto;bottom:-55px;right:-25px}.part{font-size:12px;font-weight:900;color:#6d7b94;text-transform:uppercase;letter-spacing:1px}.word{font-size:46px;font-weight:900;color:#3b60b7;margin:10px}.pron{font-size:15px;color:#75819a}.meaning{font-size:19px;font-weight:800;margin:20px 0 8px}.example{font-size:15px;color:#66738b;max-width:490px}.example em{color:#6757bf;font-style:normal;font-weight:900}.actions{display:flex;justify-content:center;gap:10px;margin-top:18px}.btn{border:0;border-radius:13px;padding:12px 18px;font:900 14px Nunito,'Noto Sans TC',sans-serif;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--blue);color:white;box-shadow:0 7px 15px #4778ec35}.soft{background:#f0f3fb;color:#5c6981}.known{background:#e7f6ee;color:var(--green)}.quizbox{max-width:650px;margin:0 auto}.question-label{color:#74819a;font-weight:800;font-size:13px}.qword{font-size:35px;font-weight:900;color:#3b60b7;margin:7px 0 17px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{background:white;border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;font:800 15px Nunito,'Noto Sans TC',sans-serif;color:var(--ink);cursor:pointer}.answer:hover{border-color:#9db7f6;background:#f7f9ff}.answer.correct{border-color:#63c299;background:#effaf4;color:#13734f}.answer.wrong{border-color:#ed9292;background:#fff3f3;color:#bb4f4f}.feedback{min-height:48px;padding-top:14px;font-weight:800;color:var(--muted)}.quiz-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.hidden{display:none!important}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:15px}.row strong{font-size:17px}.row small{display:block;color:var(--muted);margin-top:3px}.badge{font-size:12px;font-weight:900;color:#697690;background:#f2f4fa;border-radius:20px;padding:7px 10px}.badge.done{background:#e7f6ee;color:var(--green)}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:30px;background:#24324b;color:white;font-weight:800;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:700px){.wrap{padding:18px 13px 36px}.top{margin-bottom:23px}.layout{grid-template-columns:1fr}.side{padding:12px}.side h3,.goal{display:none}.nav{flex-direction:row}.nav button{flex:1;text-align:center;padding:10px 5px;font-size:13px}.nav .icon{display:block;margin:0 auto 4px}.panel{padding:19px;min-height:500px}.flashcard{min-height:270px}.word{font-size:40px}.answers{grid-template-columns:1fr}.tag{font-size:11px;padding:8px}.hero p{font-size:14px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand"><div class="logo">✦</div><span>Word Quest</span></div><div class="tag">🇺🇸 美國六年級英文</div></header>
<section class="hero"><div class="eyebrow">Learn a little every day</div><h1>英文單字探險</h1><p>翻一翻、猜一猜，讓新單字變成你的好朋友！</p></section>
<div class="layout"><aside class="side"><h3>學習模式</h3><nav class="nav"><button class="active" data-view="cards"><span class="icon">🃏</span>單字卡</button><button data-view="quiz"><span class="icon">🧠</span>小測驗</button><button data-view="words"><span class="icon">📚</span>單字表</button></nav><div class="goal"><div class="goalrow"><span>今日學習</span><span id="goalText">0 / 5</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="tiny">每天認識 5 個單字！</div></div></aside>
<main class="main"><section class="panel" id="cardsView"></section><section class="panel hidden" id="quizView"></section><section class="panel hidden" id="wordsView"></section></main></div></div><div class="toast" id="toast"></div>
<script>
const words=[
{w:'analyze',p:'/ˈæn.ə.laɪz/ · verb',m:'分析；仔細研究',e:'We will <b>analyze</b> the results of our science experiment.',t:'我們會分析科學實驗的結果。'},
{w:'approach',p:'/əˈproʊtʃ/ · verb / noun',m:'接近；方法',e:'One <b>approach</b> to solving the puzzle is to look for a pattern.',t:'解這道謎題的一個方法是找出規律。'},
{w:'communicate',p:'/kəˈmjuː.nə.keɪt/ · verb',m:'溝通；傳達',e:'The team used a map to <b>communicate</b> their plan.',t:'這個團隊用地圖來傳達他們的計畫。'},
{w:'contrast',p:'/ˈkɑːn.træst/ · verb / noun',m:'對比；差異',e:'Let’s <b>contrast</b> the two characters in the story.',t:'讓我們比較故事中的兩個角色。'},
{w:'evidence',p:'/ˈev.ə.dəns/ · noun',m:'證據；根據',e:'The footprints were <b>evidence</b> that an animal had visited.',t:'這些腳印是動物來過的證據。'},
{w:'function',p:'/ˈfʌŋk.ʃən/ · noun / verb',m:'功能；運作',e:'The <b>function</b> of roots is to take in water.',t:'根的功能是吸收水分。'},
{w:'indicate',p:'/ˈɪn.də.keɪt/ · verb',m:'指出；顯示',e:'Dark clouds may <b>indicate</b> that a storm is coming.',t:'烏雲可能表示暴風雨要來了。'},
{w:'perspective',p:'/pɚˈspek.tɪv/ · noun',m:'觀點；看法',e:'Reading the diary gave us a new <b>perspective</b>.',t:'讀了日記讓我們有了新的看法。'},
{w:'region',p:'/ˈriː.dʒən/ · noun',m:'地區；區域',e:'This <b>region</b> gets a lot of rain in the spring.',t:'這個地區春天常下很多雨。'},
{w:'significant',p:'/sɪɡˈnɪf.ə.kənt/ · adjective',m:'重要的；有重大意義的',e:'Finishing the first chapter was a <b>significant</b> step.',t:'完成第一章是重要的一步。'}];
let index=0,quizIndex=0,score=0,answered=false;let learned=new Set(JSON.parse(localStorage.getItem('wq-learned')||'[]'));
const $=s=>document.querySelector(s);function save(){localStorage.setItem('wq-learned',JSON.stringify([...learned]));updateGoal()};function updateGoal(){$('#goalText').textContent=`${Math.min(learned.size,5)} / 5`,$('#fill').style.width=`${Math.min(learned.size,5)*20}%`}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function cards(){let x=words[index];$('#cardsView').innerHTML=`<div class="section-head"><h2>單字卡</h2><span class="count">${index+1} / ${words.length}</span></div><div class="flashcard"><div class="part">${x.p}</div><div class="word">${x.w}</div><div class="pron">點「聽發音」試著大聲唸出來</div><div class="meaning">${x.m}</div><div class="example">${x.e}<br><span style="font-size:13px">${x.t}</span></div></div><div class="actions"><button class="btn soft" onclick="speak()">🔊 聽發音</button><button class="btn known" onclick="markKnown()">✓ 我學會了</button><button class="btn primary" onclick="nextCard()">下一個 →</button></div>`}
function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(words[index].w);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}function markKnown(){learned.add(words[index].w);save();toast('太棒了！已加入今日學習 ✨')}function nextCard(){index=(index+1)%words.length;cards()}
function quiz(){let q=words[quizIndex%words.length],opts=[q,...words.filter((_,i)=>i!==quizIndex%words.length).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);answered=false;$('#quizView').innerHTML=`<div class="section-head"><h2>小測驗</h2><span class="count">得分 ${score}</span></div><div class="quizbox"><div class="question-label">選出最接近的中文意思</div><div class="qword">${q.w}</div><div class="answers">${opts.map(o=>`<button class="answer" data-word="${o.w}" onclick="answer(this,'${q.w}')">${o.m}</button>`).join('')}</div><div class="feedback" id="feedback">選一個答案試試看！</div><div class="quiz-actions"><span class="tiny">第 ${quizIndex+1} 題</span><button class="btn primary" onclick="nextQuestion()">${answered?'下一題 →':'跳過 →'}</button></div></div>`}
function answer(el,correct){if(answered)return;answered=true;let yes=el.dataset.word===correct;document.querySelectorAll('.answer').forEach(b=>{if(b.dataset.word===correct)b.classList.add('correct')});if(yes){score++;$('#feedback').textContent='答對了！做得好 🎉';learned.add(correct);save()}else{el.classList.add('wrong');$('#feedback').textContent=`再記一下：${correct} 的意思是「${words.find(x=>x.w===correct).m}」`};$('#quizView .count').textContent=`得分 ${score}`;$('#quizView .quiz-actions button').textContent='下一題 →'}function nextQuestion(){quizIndex++;quiz()}
function wordList(){$('#wordsView').innerHTML=`<div class="section-head"><h2>單字表</h2><span class="count">已學會 ${learned.size} 個</span></div><div class="list">${words.map(x=>`<div class="row"><div><strong>${x.w}</strong><small>${x.m} · ${x.p.split('·')[1]}</small></div><span class="badge ${learned.has(x.w)?'done':''}">${learned.has(x.w)?'✓ 學會了':'待學習'}</span></div>`).join('')}</div>`}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['cards','quiz','words'].forEach(v=>$('#'+v+'View').classList.toggle('hidden',v!==b.dataset.view));if(b.dataset.view==='quiz')quiz();if(b.dataset.view==='words')wordList()}));updateGoal();cards();
</script><script>
function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(words[index].w);u.lang='en-US';u.rate=.85;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^en-US/i.test(v.lang)&&/google us english/i.test(v.name))||voices.find(v=>/^en-US/i.test(v.lang)&&/(female|zira|jenny|aria|samantha|ava)/i.test(v.name))||voices.find(v=>/^en-US/i.test(v.lang))||null;speechSynthesis.speak(u)}
</script><script>
function updateGoal(){let amount=Math.min(learned.size,10);$('#goalText').textContent=`${amount} / 10`;$('#fill').style.width=`${amount*10}%`}
document.querySelector('.goal .tiny').textContent='每天認識 10 個單字！';updateGoal();
</script><script>
let voiceSpeed=.85;
let speedStyles=document.createElement('style');speedStyles.textContent='@media(max-width:700px){.actions{flex-wrap:wrap}.actions .btn{flex:1 1 auto}}';document.head.appendChild(speedStyles);
function updateSpeedButton(){let button=document.querySelector('#speedButton');if(button)button.textContent=`⏱ 速度：${voiceSpeed===.65?'慢速':voiceSpeed===.85?'正常':'快速'}`}
function cycleVoiceSpeed(){voiceSpeed=voiceSpeed===.65?.85:voiceSpeed===.85?1.05:.65;updateSpeedButton()}
function addSpeedButton(){let actions=document.querySelector('#cardsView .actions');if(!actions)return;let button=document.createElement('button');button.className='btn soft';button.id='speedButton';button.setAttribute('aria-label','改變發音速度');button.addEventListener('click',cycleVoiceSpeed);actions.insertBefore(button,actions.children[1]||null);updateSpeedButton()}
const originalCardsForSpeed=window.cards;window.cards=function(){originalCardsForSpeed();addSpeedButton()};
window.speak=function(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(words[index].w);u.lang='en-US';u.rate=voiceSpeed;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^en-US/i.test(v.lang)&&/google us english/i.test(v.name))||voices.find(v=>/^en-US/i.test(v.lang)&&/(female|zira|jenny|aria|samantha|ava)/i.test(v.name))||voices.find(v=>/^en-US/i.test(v.lang))||null;speechSynthesis.speak(u)};
window.cards();
</script><script>
let voiceGender='female';
function updateGenderButton(){let button=document.querySelector('#genderButton');if(button)button.textContent=voiceGender==='female'?'👩 女聲':'👨 男聲'}
function cycleVoiceGender(){voiceGender=voiceGender==='female'?'male':'female';updateGenderButton()}
function addGenderButton(){let actions=document.querySelector('#cardsView .actions');if(!actions)return;let button=document.createElement('button');button.className='btn soft';button.id='genderButton';button.setAttribute('aria-label','切換男女聲');button.addEventListener('click',cycleVoiceGender);let speed=document.querySelector('#speedButton');actions.insertBefore(button,speed?.nextSibling||null);updateGenderButton()}
const originalCardsForGender=window.cards;window.cards=function(){originalCardsForGender();addGenderButton()};
window.speak=function(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(words[index].w);u.lang='en-US';u.rate=voiceSpeed;let english=speechSynthesis.getVoices().filter(v=>/^en-US/i.test(v.lang));let female=english.find(v=>/google us english/i.test(v.name))||english.find(v=>/(female|zira|jenny|aria|samantha|ava|victoria|karen|susan)/i.test(v.name));let male=english.find(v=>/(?:^|\W)male\b|david|guy|mark|eric|christopher|alex|daniel|james|thomas|aaron|ryan/i.test(v.name))||english.find(v=>!/(google us english|female|zira|jenny|aria|samantha|ava|victoria|karen|susan)/i.test(v.name));u.voice=voiceGender==='female'?(female||english[0]||null):(male||english[0]||null);speechSynthesis.speak(u)};
window.cards();
</script><script>
let quizQuestionOrder=[],quizQuestionPosition=0;
function startQuizRound(){quizQuestionOrder=words.map((_,i)=>i).sort(()=>Math.random()-.5);quizQuestionPosition=0;score=0}
window.quiz=function(){if(!quizQuestionOrder.length)startQuizRound();if(quizQuestionPosition>=quizQuestionOrder.length){$('#quizView').innerHTML=`<div class="section-head"><h2>本輪完成！</h2><span class="count">得分 ${score} / ${words.length}</span></div><div class="empty"><div style="font-size:48px">🎉</div><h3>你完成了這一輪小測驗！</h3><p>每個單字都只出現一次。</p><button class="btn primary" onclick="restartQuizRound()">再玩一輪 →</button></div>`;return}let q=words[quizQuestionOrder[quizQuestionPosition]],opts=[q,...words.filter(x=>x.w!==q.w).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);answered=false;$('#quizView').innerHTML=`<div class="section-head"><h2>小測驗</h2><span class="count">得分 ${score}</span></div><div class="quizbox"><div class="question-label">選出最接近的中文意思</div><div class="qword">${q.w}</div><div class="answers">${opts.map(o=>`<button class="answer" data-word="${o.w}" onclick="answer(this,'${q.w}')">${o.m}</button>`).join('')}</div><div class="feedback" id="feedback">選一個答案試試看！</div><div class="quiz-actions"><span class="tiny">第 ${quizQuestionPosition+1} 題 / ${words.length} 題</span><button class="btn primary" onclick="nextQuestion()">跳過 →</button></div></div>`};
window.nextQuestion=function(){quizQuestionPosition++;quiz()};
window.restartQuizRound=function(){startQuizRound();quiz()};
</script><script>
window.speak=function(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(words[index].w);u.lang='en-US';u.rate=voiceSpeed;u.pitch=voiceGender==='male'?.82:1;let english=speechSynthesis.getVoices().filter(v=>/^en-US/i.test(v.lang));let female=english.find(v=>/google us english/i.test(v.name))||english.find(v=>/(female|zira|jenny|aria|samantha|ava|victoria|karen|susan)/i.test(v.name));let male=english.find(v=>/(?:^|\W)male\b|david|guy|mark|eric|christopher|alex|daniel|james|thomas|aaron|ryan/i.test(v.name))||english.find(v=>!/(google us english|female|zira|jenny|aria|samantha|ava|victoria|karen|susan)/i.test(v.name));u.voice=voiceGender==='female'?(female||english[0]||null):(male||english[0]||null);speechSynthesis.speak(u)};
</script></body></html>
